name: Deploy to GitHub Pages

# 说明：
# 本项目 Pages 使用 legacy 模式（发布源 = gh-pages 分支）。
# 本工作流在 master 推送后执行 build，并把 out/ 内容提交到 gh-pages 分支，
# GitHub Pages 会自动从 gh-pages 重新发布。无需把 Pages 切成 "GitHub Actions" 模式。

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      # secrets 上下文不能用于 steps.if，先映射到 env 再用 env 判断
      GOOGLE_TRANSLATE_KEY: ${{ secrets.GOOGLE_TRANSLATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate sitemap
        run: node scripts/generate-sitemap.mjs

      - name: Restore translation cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: translate-${{ github.sha }}
          restore-keys: |
            translate-

      # 若配置了 GOOGLE_TRANSLATE_KEY（正式通道），翻译全量 15 语言；
      # 否则（无密钥）用 gtx 免密钥端点翻译本次新增的 8 语言。
      # 说明：gtx 端点（translate.googleapis.com）在海外 CI 直连可达；
      # 本地大陆被 GFW 拦截、且 mymemory 免费配额瞬时耗尽，故只能放海外 CI 跑。
      - name: Translate content (Google Cloud, all languages)
        if: env.GOOGLE_TRANSLATE_KEY != ''
        run: node scripts/translate-content.mjs

      - name: Translate new languages (gtx keyless, overseas-only)
        if: env.GOOGLE_TRANSLATE_KEY == ''
        env:
          TRANSLATE_PROVIDER: gtx
          GTX_DELAY_MS: 200
        run: node scripts/translate-content.mjs --langs ar,tr

      - name: Build static site
        run: npm run build

      - name: Persist translated JSON to master (skip CI)
        if: env.GOOGLE_TRANSLATE_KEY == ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/i18n/messages src/i18n/content
          if git diff --cached --quiet; then
            echo "no translation changes to commit"
          else
            git commit -m "chore(i18n): persist translated JSON [skip ci]"
            git push origin HEAD:master
          fi

      - name: Strip internal Next artifacts
        run: |
          # __next* 是 Next 内部 RSC 缓存（含 __next.<route>/__PAGE__.txt、__next.*.txt），
          # 不应发布：会被搜索引擎收录，且 build 间哈希不稳定。
          # 注意 _next/（单下划线）是真实静态资源，绝不能删。
          find out -name '__next*' -delete
          echo "remaining __next*: $(find out -name '__next*' | wc -l)"
          echo "html pages: $(find out -name index.html | wc -l) | tools: $(ls -1 out/tools | wc -l)"

      - name: Verify build output
        run: |
          test -f out/index.html || (echo "out/index.html missing" && exit 1)
          test -f out/CNAME || (echo "out/CNAME missing" && exit 1)
          test -f out/ads.txt || (echo "out/ads.txt missing" && exit 1)
          echo "pages: $(find out -name index.html | wc -l) | tools: $(ls -1 out/tools | wc -l)"

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "deploy: ${{ github.sha }}"
          force_orphan: false
