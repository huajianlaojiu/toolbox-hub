name: Deploy to GitHub Pages

# 说明：
# 本项目 Pages 使用 legacy 模式（发布源 = gh-pages 分支）。
# 本工作流在 master 推送后执行 build，并把 out/ 内容提交到 gh-pages 分支，
# GitHub Pages 会自动从 gh-pages 重新发布。无需把 Pages 切成 "GitHub Actions" 模式。

on:
  push:
    branches: [master]
    # 文档 / 日志 / 记忆类改动不触发约 13 分钟的全量静态构建。
    # 注意：只要本次 push 含任一未被忽略的文件，工作流仍会正常触发。
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".workbuddy/**"
      - "*.log"
  workflow_dispatch:
    inputs:
      translate:
        description: "跑增量翻译并把译文回写 master（默认关闭；gtx 失败会写英文回退）"
        type: boolean
        default: false
      langs:
        description: "要补翻的语言代码，逗号分隔"
        type: string
        default: "pl,vi,es,pt"

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      # secrets 上下文不能用于 steps.if，先映射到 env 再用 env 判断
      GOOGLE_TRANSLATE_KEY: ${{ secrets.GOOGLE_TRANSLATE_KEY }}
      # 自动翻译默认关闭。此前每次 push 都在无密钥时跑 gtx --langs pl,vi，
      # 端点失败会把英文源串原样写成「译文」并回写 master：既污染字典（永久挡住
      # 补翻），又产生 [skip ci] 提交使远程领先、后续 push 必须先 rebase。
      # 需要补翻时到 Actions 手动 Run workflow 并勾选 translate。
      RUN_TRANSLATE: ${{ github.event_name == 'workflow_dispatch' && inputs.translate == true && 'true' || 'false' }}
      TRANSLATE_LANGS: ${{ github.event_name == 'workflow_dispatch' && inputs.langs || 'pl,vi,es,pt' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # sitemap 由 package.json 的 prebuild 在 npm run build 前生成；
      # 这里不再重复执行（此前一次构建跑了两遍 generate-sitemap.mjs）。
      - name: Restore translation cache
        if: env.RUN_TRANSLATE == 'true'
        uses: actions/cache@v4
        with:
          path: .cache
          key: translate-${{ github.sha }}
          restore-keys: |
            translate-

      # 有正式密钥走全量；无密钥用 gtx 免密钥端点（仅海外 CI 可达）。
      # 两个分支都只在手动触发且勾选 translate 时执行。
      - name: Translate content (Google Cloud, all languages)
        if: env.RUN_TRANSLATE == 'true' && env.GOOGLE_TRANSLATE_KEY != ''
        run: node scripts/translate-content.mjs

      - name: Translate selected languages (gtx keyless, overseas-only)
        if: env.RUN_TRANSLATE == 'true' && env.GOOGLE_TRANSLATE_KEY == ''
        env:
          TRANSLATE_PROVIDER: gtx
          GTX_DELAY_MS: 200
        run: node scripts/translate-content.mjs --langs "$TRANSLATE_LANGS"

      - name: Build static site
        run: npm run build

      - name: Persist translated JSON to master (skip CI)
        if: env.RUN_TRANSLATE == 'true' && env.GOOGLE_TRANSLATE_KEY == ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 防投毒：回写前删掉所有「值 === 英文源串」的失败回退条目。
          node scripts/clean-fallbacks.mjs
          # posts 目录此前被漏掉，博客译文的补翻结果永远回写不进仓库。
          git add src/i18n/messages src/i18n/content src/i18n/posts
          if git diff --cached --quiet; then
            echo "no translation changes to commit"
          else
            git commit -m "chore(i18n): persist translated JSON [skip ci]"
            git push origin HEAD:master
          fi

      - name: Strip internal Next artifacts
        run: |
          # __next* 是 Next 内部 RSC 缓存（含 __next.<route>/__PAGE__.txt、__next.*.txt），
          # 不应发布：会被搜索引擎收录，且 build 间哈希不稳定。
          # 注意 _next/（单下划线）是真实静态资源，绝不能删。
          find out -name '__next*' -delete
          remaining=$(find out -name '__next*' | wc -l)
          test "$remaining" -eq 0 || (echo "__next* cleanup failed: $remaining left" && exit 1)
          echo "remaining __next*: $remaining"
          echo "html pages: $(find out -name index.html | wc -l) | tools: $(ls -1 out/tools | wc -l)"

      - name: Verify build output
        run: |
          test -f out/index.html || (echo "out/index.html missing" && exit 1)
          test -f out/CNAME || (echo "out/CNAME missing" && exit 1)
          test -f out/ads.txt || (echo "out/ads.txt missing" && exit 1)
          echo "pages: $(find out -name index.html | wc -l) | tools: $(ls -1 out/tools | wc -l)"

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "deploy: ${{ github.sha }}"
          force_orphan: false
